# Deliberately broken config: conciseness weight dominates correctness.
# Expected behaviour: agent learns to write short wrong answers.
# composite = 0.2*correctness + 0.7*conciseness + 0.1*format
# A one-sentence wrong answer scores ~0.9 composite — better than a correct
# verbose answer scoring ~0.4 composite.
# This is the reward hacking demonstration for the paper (Section 7.2).
# DO NOT use this config for real experiments.
experiment:
  name: reward_hacking_demo
  description: "Conciseness-dominant — deliberately broken for hacking demo"
  note: "For paper Section 7.2 only. Not a valid experiment config."

reward_composer:
  solved_threshold: 1.0
  signals:
    - name: correctness
      weight: 0.20
    - name: conciseness
      weight: 0.70
    - name: format_compliance
      weight: 0.10
